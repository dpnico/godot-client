name: CI/CD

on:
  push:
  pull_request:

jobs:

  test:

    runs-on: ubuntu-latest

    container:
      image: liphium/godot-mono:4.6.2

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Lint
        run: dotnet format godot-client.sln --verify-no-changes --verbosity diagnostic
        
      - name: Build Godot Project
        run: dotnet build godot-client.csproj
        
      - name: Import Resources
        run: godot --headless --editor --quit
        
      - name: Test
        uses: godot-gdunit-labs/gdUnit4-action@v1
        with:
          godot-version: '4.6.2'
          paths: 'res://test'
          godot-dotnet: true