name: CI/CD

on:
  push:
  pull_request:
    
permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:

  test:

    runs-on: ubuntu-latest
    
    container:
      image: liphium/godot-mono:4.6.2

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Lint
        run: dotnet format godot-client.sln --verify-no-changes --verbosity diagnostic
        
      - name: Install xvfb
        run: apt-get update && apt-get install -y xvfb
        
      - name: Test
        uses: godot-gdunit-labs/gdUnit4-action@v1
        with:
          godot-version: '4.6.2'
          paths: 'res://test'
          godot-net: true