name: CI/CD

on:
  push:
  pull_request:

jobs:

  test:

    runs-on: ubuntu-latest

    container:
      image: liphium/godot-mono:4.6.2

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Lint
        run: dotnet format godot-client.sln --verify-no-changes --verbosity diagnostic
      
      - name: Test
        uses: godot-gdunit-labs/gdUnit4Net@v1
        with:
          godot-version: '4.6.2'
          paths: 'res://test'