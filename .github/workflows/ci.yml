name: CI/CD

on:
  push:
  pull_request:
    
permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:

  lint:

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
          
      - name: Build Godot Project
        run: dotnet build godot-client.sln

      - name: Lint
        run: dotnet format godot-client.sln --verify-no-changes --verbosity diagnostic
        
  test:

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      - name: Test
        uses: godot-gdunit-labs/gdUnit4-action@v1
        with:
          godot-version: '4.6.2'
          paths: 'res://test'
          godot-net: true
          report-name: 'coverage.xml'

      - name: Code Coverage Report
        uses: irongut/CodeCoverageSummary@v1.3.0
        with:
          filename: ./reports/**/coverage.cobertura.xml
          badge: true
          fail_below_min: true
          format: markdown
          hide_branch_rate: false
          hide_complexity: true
          indicators: true
          output: both
          thresholds: '65 85'