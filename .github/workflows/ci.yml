name: CI/CD

on:
  push:
  pull_request:

jobs:

  test:

    runs-on: ubuntu-latest

    container:
      image: liphium/godot-mono:4.6.2

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: 8.0.x

      - name: Lint
        run: dotnet format godot-client.sln --verify-no-changes --verbosity diagnostic
      
      - uses: godot-gdunit-labs/gdUnit4-action@v1
        uses: Setup .NET
        with:
          godot-version: '4.6.2'
          paths: 'res://test'