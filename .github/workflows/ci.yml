name: CI/CD

on:
  push:
  pull_request:

env:
  container: liphium/godot-mono:4.6.2
    
permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:

  test:

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Lint
        run: dotnet format godot-client.sln --verify-no-changes --verbosity diagnostic
        
      - name: Prepare Godot
        run: godot --headless --import | godot --headless --build-solutions --quit

      - name: Test
        uses: godot-gdunit-labs/gdUnit4-action@v1
        env:
          GODOT_BIN: /godot/Godot
        with:
          godot-net: true
          godot-version: '4.6.2'
          paths: 'res://test'