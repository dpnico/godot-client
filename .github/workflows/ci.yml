name: CI/CD

on:
  push:
  pull_request:

jobs:

  test:

    runs-on: ubuntu-latest

    # container:
    #   image: liphium/godot-mono:4.6.2

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Lint
        run: dotnet format godot-client.sln --verify-no-changes --verbosity diagnostic

      #- name: NUnit Test
      #  run: dotnet test godot-client.Test/godot-client.Test.csproj

      # - name: GdUnit Test
      #   run: |
      #     rm -rf .godot/mono/temp
      #     export GODOT_BIN=$(which godot)
      #     chmod +x addons/gdUnit4/runtest.sh
      #    addons/gdUnit4/runtest.sh --godot_binary "$GODOT_BIN" --headless

      - name: Build Solutions
        run: godot --headless --build-solutions --quit

      - uses: godot-gdunit-labs/gdUnit4-action@v1
        with:
          godot-version: '4.6.2'
          paths: 'res://test'